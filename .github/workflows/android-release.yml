name: Publish Android TV release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUVIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NUVIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      NUVIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Load the Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NUVIO_KEYSTORE_PATH: ${{ runner.temp }}/nuvio-android-release.jks
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          required = ('KEYSTORE_BASE64', 'NUVIO_KEYSTORE_PASSWORD', 'NUVIO_KEY_ALIAS', 'NUVIO_KEY_PASSWORD')
          if not all(os.environ.get(key) for key in required):
              raise SystemExit('Configure the four Android signing secrets before publishing.')
          path = pathlib.Path(os.environ['NUVIO_KEYSTORE_PATH'])
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write('NUVIO_KEYSTORE_PATH=' + str(path) + '\n')
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Verify APK and prepare Android release metadata
        run: |
          python3 tools/prepare_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output dist
      - name: Require a new Android version
        run: |
          python3 - <<'PY'
          import json, subprocess
          new = json.load(open('dist/android-tv-stable.json'))['latest']
          old = json.load(open('updates/android-tv/stable.json'))['latest']
          if old and new['versionCode'] <= old['versionCode']:
              raise SystemExit('Increase Android VERSION_CODE before releasing.')
          tag = 'android-tv-v' + new['versionName']
          existing = subprocess.check_output(['git', 'ls-remote', '--tags', 'origin', 'refs/tags/' + tag], text=True)
          if existing.strip():
              raise SystemExit('This Android version already exists; published assets are never overwritten.')
          PY
      - name: Publish the APK, feed snapshot, checksums and matching source
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          git archive --format=tar.gz --prefix=NuvioMaxd-AndroidTV/ --output=dist/NuvioMaxd-AndroidTV-source.tar.gz "$GITHUB_SHA"
          gh release create "android-tv-v$version" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Nuvio Max'd Android TV $version" --notes-file docs/RELEASE_NOTES.md
      - name: Advance only the Android TV stable feed
        run: |
          cp dist/android-tv-stable.json updates/android-tv/stable.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/android-tv/stable.json
          git commit -m 'Update Android TV stable release feed'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove the temporary signing key
        if: always()
        run: |
          if [ -n "${NUVIO_KEYSTORE_PATH:-}" ]; then
            rm -f "$NUVIO_KEYSTORE_PATH"
          fi
